name: storage-engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - run: python3 benchmarks/validate.py
      - name: Check published tables match the raw data
        run: |
          python3 benchmarks/report.py
          git diff --exit-code -- README.md benchmarks/README.md
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test ./internal/storage -run '^$' -fuzz FuzzRead -fuzztime 10s
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
  crash-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 1000 SIGKILL and restart cycles
        run: STRATA_CRASH_CYCLES=1000 go test -run '^TestCrashRecovery$' -v -timeout 15m .
