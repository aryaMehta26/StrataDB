# Development only. Bind ports to localhost; these are disposable local credentials.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: stratadb-local
      MINIO_ROOT_PASSWORD: stratadb-local-password
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
volumes:
  minio-data:
